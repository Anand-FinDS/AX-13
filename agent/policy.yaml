# Autonomy settings the gates and the planner read. Prototype values (illus.), mirrored in
# Autonomy policy §6; change them here, not in code.

confidence:
  min: 0.6              # Autonomy policy §6 #1: below this, a human decides (§2.1)
  base: 0.5             # decision confidence at the line threshold ...
  full_margin: 20       # ... rising to 1.0 at 20 display points above it

escalation:             # Autonomy policy §4
  angry_sentiments: [angry]
  dispute_categories: [charge]            # a charge ticket raised in frustration or anger is a dispute
  dispute_sentiments: [frustrated, angry]
  high_value_tier: high                   # every action on these merchants needs approval (§1.3)

actions:
  channel: whatsapp
  technician_window: "10:00-13:00"
  days_ahead: 1                           # technician bookings and field visits: next day
  loan_cooldown_days: 90                  # no second loan offer within 90 days
  message_max_words: 90
  loan_max_words: 140

# LLM spend: only these merchants get LLM drafting (in their language) and the LLM judge on every gated
# message. Everyone else gets the code-filled English template and a rules-only gate; loan drafts always
# get the judge. RM-queue items can be drafted by the LLM on demand from the app.
llm_merchants: [M_DEMO_RAVI, M_DEMO_MEENA, M_DEMO_SMALL]
